<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>PBT Curve Map — 과정기반치료(PBT) 사례개념화 도구 (v2.0)</title>
<style>
:root{--ui-scale:1.3;--sidebar-width:clamp(266px,calc(266px * var(--ui-scale)),480px);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#171717;background:#ececec;font-synthesis:none}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
button,input,textarea,select{font:inherit}button{cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column;min-height:0}
.top{flex:none;background:#fff;border-bottom:1px solid #c8c8c8;z-index:12}
/* 상단 메뉴: 제목은 좌측, 6개 핵심 도구는 우측 */
.topline{display:flex;align-items:center;gap:14px;padding:10px 16px 9px;min-height:54px}
.brand{font-size:calc(17px * var(--ui-scale));font-weight:800;white-space:nowrap;letter-spacing:-.6px;flex:none}
.brand small{display:block;font-size:calc(10px * var(--ui-scale));color:#777;font-weight:500;letter-spacing:.1px}
.toolbar-main{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex:1;min-width:0;margin-left:auto}
.top-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex:none;min-width:0;flex-wrap:wrap}
.top-actions-left{justify-content:flex-end}
.top-actions-right{justify-content:flex-end;margin-left:auto}
.sep{height:24px;width:1px;background:#ddd;flex:none;margin:0 3px}
.toolbar-menu{position:relative;flex:none}
.toolbar-menu>summary{list-style:none;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;color:#202020;background:#fff;border:1px solid #cecece;border-radius:6px;padding:7px 10px;font-size:calc(12px * var(--ui-scale));font-weight:600;white-space:nowrap;transition:background .12s,border-color .12s}
.toolbar-menu>summary::-webkit-details-marker{display:none}
.toolbar-menu>summary:hover,.toolbar-menu[open]>summary{background:#f2f2f2;border-color:#999}
.toolbar-menu>summary:focus-visible{outline:2px solid #555;outline-offset:2px}
.toolbar-menu-items{position:absolute;top:calc(100% + 6px);right:0;z-index:25;min-width:calc(145px * var(--ui-scale));padding:5px;background:#fff;border:1px solid #c7c7c7;border-radius:8px;box-shadow:0 8px 22px #0002;display:flex;flex-direction:column;gap:3px}
.toolbar-menu-items button{border:0;text-align:left;border-radius:5px;width:100%;font-weight:550;padding:9px 11px}
.toolbar-menu-items button:hover{background:#eee}
button{color:#202020;background:#fff;border:1px solid #cecece;border-radius:6px;padding:7px 10px;font-size:calc(12px * var(--ui-scale));font-weight:600;white-space:nowrap;transition:background .12s,border-color .12s}
button:hover{background:#f2f2f2;border-color:#999}button:focus-visible{outline:2px solid #555;outline-offset:2px}
button.active,button.primary{background:#202020;border-color:#202020;color:white}button.active:hover,button.primary:hover{background:#444}
/* 강조하기는 선택/해제 상태 모두 선명한 붉은색 톤을 유지합니다. */
button.highlight-btn{background:#bd2733;color:#fff;border-color:#a3202b;font-weight:800}
button.highlight-btn:hover{background:#a31d29;border-color:#851923}
button.highlight-btn.active{background:#851622;border-color:#6f101a;color:#fff}
button.highlight-btn.active:hover{background:#70121b}
button:disabled{cursor:not-allowed;opacity:.35}button.iconbtn{width:calc(34px * var(--ui-scale));min-width:34px;padding:7px 0;text-align:center}
#sidebarToggle{display:none;margin-left:auto}
.area{display:flex;flex:1;min-height:0;position:relative}
.side{flex:0 0 var(--sidebar-width);width:var(--sidebar-width);background:#eff1f4;border-right:1px solid #ccd1d8;display:flex;flex-direction:column;gap:12px;padding:12px;overflow-y:auto;overflow-x:hidden;z-index:10;scrollbar-width:thin;scrollbar-color:#c7ccd3 transparent}
.panel{flex:none;margin:0;padding:16px 16px 18px;border:1px solid #d4d9e0;border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(29,36,49,.055)}
.panel h2{font-size:calc(12px * var(--ui-scale));letter-spacing:.02em;margin:0 0 15px;font-weight:800;color:#222}
.panel p{font-size:calc(12px * var(--ui-scale));line-height:1.65;color:#666;margin:0}
.instr{color:#464646!important}

/* 조작법: 마우스 제스처를 한눈에 알아보는 흑백 픽토그램 */
.howto{display:flex;flex-direction:column;gap:8px}
.howto-row{display:flex;align-items:center;gap:12px;min-height:calc(33px * var(--ui-scale));font-size:calc(11.5px * var(--ui-scale));line-height:1.30;color:#333}
.howto-icon{width:calc(33px * var(--ui-scale));height:calc(33px * var(--ui-scale));flex:none;border:1px solid #d9dde3;border-radius:7px;display:grid;place-items:center;background:#fafafa;color:#252525}
.howto-icon svg{width:74%;height:74%;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.howto-text{min-width:0}.howto-text b{font-weight:750;color:#111}.howto-text small{display:block;color:#6b6b6b;font-size:calc(10.5px * var(--ui-scale));margin-top:3px}
.hintkey{border:1px solid #d2d2d2;border-radius:3px;padding:0 4px;font-size:calc(10px * var(--ui-scale));color:#888}
.field{display:block;margin:11px 0 0;font-size:calc(11px * var(--ui-scale));font-weight:700;color:#555}
.field textarea,.field input,.field select{display:block;margin-top:6px;width:100%;background:#fff;border:1px solid #c7c7c7;border-radius:5px;color:#222;outline:0;font-weight:400;padding:9px;font-size:calc(12px * var(--ui-scale))}
.field textarea:focus,.field input:focus,.field select:focus{border-color:#333}
.field textarea{min-height:95px;resize:vertical;line-height:1.5}
.fieldrow{display:flex;gap:8px}.fieldrow>*{width:50%;flex:1;min-width:0}
.actionrow{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.actionrow>button{flex:1}
/* 노드 강조: 흑색·적색 2개 버튼. 선택 상태와 무관하게 버튼 색상 고정 */
.ins-highlight-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:17px}
.ins-highlight-row button{width:100%;min-width:0;padding:12px 3px;border-radius:7px;color:#fff;font-weight:800}
.ins-highlight-black,.ins-highlight-black.active{background:#202020;border:1.5px solid #202020;color:#fff}
.ins-highlight-black:hover,.ins-highlight-black.active:hover{background:#202020;border-color:#202020;color:#fff}
.ins-highlight-red,.ins-highlight-red.active{background:#b4232d;border:1.5px solid #b4232d;color:#fff}
.ins-highlight-red:hover,.ins-highlight-red.active:hover{background:#b4232d;border-color:#b4232d;color:#fff}
.ins-highlight-row button:focus-visible{outline:2px solid #777;outline-offset:3px}
#inspector .field:first-child{margin-top:0}
#inspector .fieldrow>.field{margin-top:0}
#inspector .actionrow>*{min-width:0}

/* 슬라이더는 수치 입력과 독립적으로 움직이며 선택한 도식에 즉시 반영됩니다. */
#inspector .field input.setting-slider{appearance:auto;display:block;width:100%;height:24px;min-height:24px;padding:0;margin:10px 0 7px;border:0;background:transparent;accent-color:#333;cursor:pointer;touch-action:pan-y}
#inspector .slider-value{float:right;color:#555;font-weight:700;font-size:calc(11px * var(--ui-scale));font-variant-numeric:tabular-nums}
#inspector .field input[type=number]{font-variant-numeric:tabular-nums}
#inspector .fieldrow{margin-top:2px}
hr{border:0;border-top:1px solid #e7e7e7;margin:16px 0}
.checkbox{display:flex;align-items:center;gap:8px;font-size:calc(12px * var(--ui-scale));margin:11px 0;color:#424242;cursor:pointer}.checkbox input{accent-color:#222;width:15px;height:15px}
.mini{font-size:calc(11px * var(--ui-scale))!important;color:#777!important;line-height:1.65}
#stage{position:relative;flex:1;min-width:0;overflow:hidden;background:#e6e6e6}
#paper{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
#paper.mode-note{cursor:crosshair}#paper.mode-connect{cursor:crosshair}#paper.mode-pan{cursor:grab}#paper.is-dragging.mode-pan{cursor:grabbing}
#paper text{user-select:none;pointer-events:none}
#paper [data-kind=node]{cursor:grab}#paper [data-kind=resize]{cursor:nwse-resize}#paper [data-kind=control]{cursor:move}#paper [data-kind=endpoint]{cursor:crosshair}#paper [data-kind=edge]{cursor:pointer}
#paper.mode-connect [data-kind=node]{cursor:crosshair}
.node-rect{fill:#fff;stroke:#161616;stroke-width:2}
#paper .selection{fill:none;stroke:#282828;stroke-width:1.8;stroke-dasharray:8 6;pointer-events:none}
#paper .ctrl-line{stroke:#777;stroke-width:1.4;stroke-dasharray:5 5;pointer-events:none}
#paper .ctrl-dot{fill:#fff;stroke:#111;stroke-width:2}
#paper .endpoint-dot{fill:#171717;stroke:#fff;stroke-width:2.5}
#paper .drop-highlight{fill:none;stroke:#111;stroke-width:3;stroke-dasharray:9 4;pointer-events:none}
#paper .marquee{fill:#777;fill-opacity:.1;stroke:#222;stroke-dasharray:7 4;stroke-width:1.6;pointer-events:none}
#paper .paper-outline{fill:none;stroke:#a0a0a0;stroke-width:1.4;pointer-events:none}
/* The editing surface sits directly over the SVG memo; no floating dialog. */
#paper [data-kind=node].editing text{visibility:hidden}
#textEdit{position:absolute;display:none;z-index:6;background:transparent;border:0;box-shadow:none;padding:0;pointer-events:none}
#textEdit textarea{display:block;width:100%;height:100%;min-height:0;max-height:none;margin:0;resize:none;border:0;outline:0;background:transparent;color:#111;text-align:center;font-weight:500;white-space:pre-wrap;overflow-wrap:break-word;overflow:auto;scrollbar-width:thin;caret-color:#111;pointer-events:auto}
#textEdit textarea::selection{background:#bcbcbc;color:#111}
.dialogBackdrop{position:fixed;inset:0;background:#0008;display:none;z-index:30;align-items:center;justify-content:center;padding:16px}
.dialog{background:#fff;max-width:min(calc(500px * var(--ui-scale)),96vw);width:100%;border-radius:9px;border:1px solid #aaa;padding:20px;max-height:88dvh;overflow:auto;box-shadow:0 15px 50px #0004}
.dialog h2{font-size:calc(17px * var(--ui-scale));margin:0 0 7px}.dialog p{font-size:calc(12px * var(--ui-scale));color:#777;margin:0 0 14px;line-height:1.6}
.zoneFields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.zoneFields label{font-size:calc(11px * var(--ui-scale));color:#777}.zoneFields input{width:100%;border:1px solid #bbb;padding:8px 6px;border-radius:4px;font-size:calc(12px * var(--ui-scale));margin-top:5px}
.dialogBtns{display:flex;justify-content:flex-end;gap:7px;margin-top:18px}
.fileinput{display:none}
/* 선택 상황에 맞춰 패널을 바꿔 스크롤과 중복 안내를 줄임 */
#inspector{display:none}
.side.selection-active #guidePanel{display:none}
.side.selection-active #inspector{display:block}
#canvasPanel{border-bottom:1px solid #d4d9e0}
#canvasPanel .checkbox{margin:13px 0}
#inspector .field{margin-top:14px}
#inspector .fieldrow>.field{margin-top:0}
/* 짧은 화면에서는 줄간격을 조금 압축하되 버튼을 숨기지는 않습니다. */
@media(max-height:800px){.side{gap:9px;padding:9px}.panel{padding:12px 14px 14px}.howto{gap:5px}.howto-row{gap:10px;min-height:calc(30px * var(--ui-scale))}.howto-icon{width:calc(30px * var(--ui-scale));height:calc(30px * var(--ui-scale))}}
.toolbar-main .top-actions-right{margin-left:0}
.toolbar-main button,.toolbar-menu>summary{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px}
.toolbar-main button svg,.toolbar-menu>summary svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toolbar-menu>summary{height:38px}
#fitBtn{width:100%;margin-top:8px}
@media(min-width:1151px) and (max-width:1280px){.topline{gap:8px;padding:9px 10px}.brand{font-size:calc(15px * var(--ui-scale))}.toolbar-main button,.toolbar-menu>summary{padding:6px 7px;font-size:calc(11px * var(--ui-scale))}}
@media(max-height:700px){.side.selection-active #canvasPanel{display:none}}

@media(max-width:1150px){.topline{flex-wrap:wrap;gap:6px;padding:8px}.brand{font-size:calc(15px * var(--ui-scale));margin:0 5px}.brand small{font-size:calc(9px * var(--ui-scale))}.toolbar-main{order:3;flex:1 0 100%;width:100%;justify-content:flex-end;margin-left:auto}.top-actions{gap:4px;justify-content:flex-end}.top-actions button{padding:7px 9px}#sidebarToggle{margin-left:auto;order:2}}
@media(max-width:920px){.side{position:absolute;top:0;bottom:0;left:0;box-shadow:8px 0 25px #0002;transform:translateX(-105%);transition:transform .16s}.side.open{transform:translateX(0)}#sidebarToggle{display:block}.topline{min-height:0}}
@media(max-width:720px){.toolbar-main{flex-wrap:wrap;justify-content:flex-end}.top-actions-right{width:100%;margin-left:0;justify-content:flex-end;flex-wrap:wrap}.toolbar-main button,.toolbar-menu>summary{font-size:calc(11px * var(--ui-scale));padding:7px 8px}}

@media(max-width:480px){.brand small{display:none}.zoneFields{grid-template-columns:repeat(2,1fr)}}

/* 모든 사용자에게 동일한 130% UI 가독성 설정 적용 */
@media(max-width:920px){.side{width:min(90vw,var(--sidebar-width));max-width:90vw;flex-basis:auto}}
@media(max-width:520px){.brand{font-size:calc(13px * var(--ui-scale))}}
</style>
</head>
<body>
<div id="app">
<header class="top">
 <div class="topline">
  <div class="brand">PBT Curve Map <small>과정기반치료(PBT) 사례개념화 도구</small></div>
  <div class="toolbar-main">
   <nav class="top-actions top-actions-right" aria-label="문서·편집·내보내기">
    <button id="newBtn" title="새 문서"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7M9 15h6m-3-3v6"/></svg>새 문서</button>
    <button id="saveBtn" title="편집 가능한 JSON 파일 저장 (Ctrl+S)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12l4 4v12a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v6h8"/></svg>저장</button>
    <button id="openBtn" title="JSON 파일 불러오기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18V6a2 2 0 0 1 2-2h6l2 3h6a2 2 0 0 1 2 2v2"/><path d="M3 18l3-7h15l-3 9H5a2 2 0 0 1-2-2z"/></svg>불러오기</button>
    <details class="toolbar-menu" id="exportMenu">
     <summary aria-label="이미지 내보내기 메뉴"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 16-5-5-9 10"/></svg>이미지 내보내기 <span aria-hidden="true">⌄</span></summary>
     <div class="toolbar-menu-items">
      <button id="svgBtn" title="벡터 이미지 내보내기">SVG 저장</button>
      <button id="pngBtn" title="고해상도 이미지 내보내기">PNG 저장</button>
     </div>
    </details>
    <button id="exampleBtn" title="예제 불러오기: 현재 도식을 교체합니다"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1zM12 6v14"/></svg>예제 확인</button>
   </nav>
  </div>
  <button id="sidebarToggle" aria-label="편집 설정 열기">⚙ 설정</button>
 </div>
</header>
<div class="area">
 <aside class="side" id="sidebar">
  <section class="panel" id="guidePanel"><h2>그리는 방법</h2>
   <div class="howto" aria-label="편집기 주요 조작법">
    <div class="howto-row" title="마우스 더블클릭으로 노드 생성"><span class="howto-icon"><svg viewBox="0 0 30 30" aria-hidden="true"><rect x="10" y="3" width="13" height="23" rx="6.5"/><path d="M16.5 3v9M10 12h13"/><path d="M4 5l-2 2m5-2 2 2M4 11l-2 2m5-2 2 2"/></svg></span><span class="howto-text"><b>노드 만들기</b><small>빈 곳 더블클릭</small></span></div>
    <div class="howto-row" title="기존 노드를 두 번 클릭해서 글 수정"><span class="howto-icon"><svg viewBox="0 0 30 30" aria-hidden="true"><rect x="3.5" y="5" width="21" height="20" rx="3"/><path d="M10 10v10m-3 0h6M8 10h4"/><path d="M18 20l5-5 2 2-5 5-3 1z" fill="#fff"/></svg></span><span class="howto-text"><b>내용 수정</b><small>노드 더블클릭</small></span></div>
    <div class="howto-row" title="같은 방향으로 다시 끌어 놓으면 연결 삭제"><span class="howto-icon"><svg viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="4" width="9" height="9" rx="1"/><rect x="19" y="17" width="9" height="9" rx="1"/><path d="M11 8q14-1 13 9m-3-3 3 3 3-3"/></svg></span><span class="howto-text"><b>연결·삭제</b><small>노드 끌어 놓기</small></span></div>
    <div class="howto-row" title="검은 점은 양 끝, 흰 점은 곡선 조절"><span class="howto-icon"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M3 23C7 2 22 28 27 5"/><circle cx="3" cy="23" r="2.4" fill="#222"/><circle cx="27" cy="5" r="2.4" fill="#222"/><circle cx="10" cy="9" r="2.5" fill="#fff"/><circle cx="21" cy="23" r="2.5" fill="#fff"/></svg></span><span class="howto-text"><b>화살표 수정</b><small>검은 점·흰 점 드래그</small></span></div>
    <div class="howto-row" title="Shift 키를 누르고 여러 노드를 클릭"><span class="howto-icon"><svg viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="4" width="15" height="15" rx="2"/><rect x="12" y="13" width="15" height="14" rx="2" fill="#fafafa"/><path d="m16 20 3 3 5-6"/></svg></span><span class="howto-text"><b>다중 선택</b><small>Shift+클릭 / 영역 드래그</small></span></div>
    <div class="howto-row" title="선택된 노드들의 크기, 너비, 글자 크기를 함께 변경"><span class="howto-icon"><svg viewBox="0 0 30 30" aria-hidden="true"><rect x="4" y="4" width="15" height="15" rx="1.5"/><path d="M11 9v6m-3-6h6"/><path d="M20 20l7 7m-7 3v-6h6"/></svg></span><span class="howto-text"><b>일괄 변경</b><small>선택 후 속성 조절</small></span></div>
    <div class="howto-row" title="마우스 휠 버튼 누른 채 화면 이동"><span class="howto-icon"><svg viewBox="0 0 30 30" aria-hidden="true"><rect x="9" y="3" width="12" height="24" rx="6"/><path d="M15 3v10M9 13h12"/><rect x="13" y="5" width="4" height="6" rx="1" fill="#222"/><path d="M6 18H2m2-2-2 2 2 2M24 18h4m-2-2 2 2-2 2"/></svg></span><span class="howto-text"><b>화면 이동</b><small>휠클릭+드래그</small></span></div>
    <div class="howto-row" title="휠을 위아래로 굴려 확대·축소"><span class="howto-icon"><svg viewBox="0 0 30 30" aria-hidden="true"><rect x="9" y="3" width="12" height="24" rx="6"/><path d="M15 3v11M9 14h12"/><rect x="13.5" y="6" width="3" height="6" rx="1.5" fill="#222"/><path d="m5 9-2-2-2 2m2-2v7m22 1 2 2 2-2m-2 2v-7"/></svg></span><span class="howto-text"><b>확대·축소</b><small>마우스 휠</small></span></div>
   </div>
  </section>
  <section class="panel" id="inspector" aria-live="off"></section>
  <section class="panel" id="canvasPanel"><h2>캔버스 설정</h2>

function borderPoint(n,toward){
 const c=center(n),dx=toward.x-c.x,dy=toward.y-c.y;
 const hx=n.w/2,hy=n.h/2;
 if(Math.abs(dx)<.001&&Math.abs(dy)<.001)return{x:c.x+hx,y:c.y};
 const k=Math.min(Math.abs(dx)>1e-7?hx/Math.abs(dx):Infinity,Math.abs(dy)>1e-7?hy/Math.abs(dy):Infinity);
 return{x:c.x+dx*k,y:c.y+dy*k};
}
function anchorPoint(n,anchor){
 return {x:n.x+clamp(anchor.x,0,1)*n.w,y:n.y+clamp(anchor.y,0,1)*n.h};
}
function nearestAnchor(n,p){
 const x=clamp(p.x,n.x,n.x+n.w),y=clamp(p.y,n.y,n.y+n.h);
 const candidates=[{dist:Math.abs(y-n.y),x:(x-n.x)/n.w,y:0},
  {dist:Math.abs(y-(n.y+n.h)),x:(x-n.x)/n.w,y:1},
  {dist:Math.abs(x-n.x),x:0,y:(y-n.y)/n.h},
  {dist:Math.abs(x-(n.x+n.w)),x:1,y:(y-n.y)/n.h}];
 candidates.sort((a,b)=>a.dist-b.dist);
 return {x:Math.round(candidates[0].x*1000)/1000,y:Math.round(candidates[0].y*1000)/1000,distance:candidates[0].dist};
}
function geom(e){
 const a=doc.nodes.find(n=>n.id===e.from),b=doc.nodes.find(n=>n.id===e.to);
 if(!a||!b)return null;
 let p0,p3;
 if(a.id===b.id){p0={x:a.x+a.w,y:a.y+a.h*.62};p3={x:a.x+a.w*.63,y:a.y};}
 else{p0=borderPoint(a,center(b));p3=borderPoint(b,center(a));}
 if(e.fromAnchor)p0=anchorPoint(a,e.fromAnchor);
 if(e.toAnchor)p3=anchorPoint(b,e.toAnchor);
 const c1={x:p0.x+e.o1.x,y:p0.y+e.o1.y},c2={x:p3.x+e.o2.x,y:p3.y+e.o2.y};
 return {p0,p3,c1,c2,d:`M ${p0.x.toFixed(2)} ${p0.y.toFixed(2)} C ${c1.x.toFixed(2)} ${c1.y.toFixed(2)}, ${c2.x.toFixed(2)} ${c2.y.toFixed(2)}, ${p3.x.toFixed(2)} ${p3.y.toFixed(2)}`};
}
function autoCurve(e,bend=28){

 if(!a||!b)return;
 if(a===b){e.o1={x:140,y:-72};e.o2={x:100,y:-110};return;}
 const {p0,p3}=geom(e),dx=p3.x-p0.x,dy=p3.y-p0.y;
 const len=Math.max(1,Math.hypot(dx,dy)),nx=-dy/len,ny=dx/len;
 e.o1={x:dx*.36+nx*bend,y:dy*.36+ny*bend};e.o2={x:-dx*.36+nx*bend,y:-dy*.36+ny*bend};
}
function straight(e){const g=geom(e);if(!g)return;const dx=g.p3.x-g.p0.x,dy=g.p3.y-g.p0.y;e.o1={x:dx/3,y:dy/3};e.o2={x:-dx/3,y:-dy/3};}
function textLines(s,maxW,fs,weight=500){
 measureCtx.font=`${weight} ${fs}px system-ui, -apple-system, 'Malgun Gothic', sans-serif`;
 const measure=a=>measureCtx.measureText(a).width;
 const result=[];
 String(s).split('\n').forEach(p=>{
  if(!p){result.push('');return;}
  const tokens=p.match(/\S+|\s+/g)||[''];let line='';
  for(const token of tokens){
   const attempt=line+token;
   if(measure(attempt)<=maxW){line=attempt;continue;}
   if(line.trim()){result.push(line.trimEnd());line='';}
   if(measure(token)<=maxW){line=token.trimStart();continue;}
   for(const ch of Array.from(token)){
     if(measure(line+ch)>maxW&&line){result.push(line);line='';}
     line+=ch;
   }
  }
  result.push(line.trimEnd());
 });
 return result.length?result:[''];
}
// 드래그 중에는 텍스트가 바뀌지 않으므로 줄바꿈 계산 결과를 재사용합니다.
const wrappedTextCache=new WeakMap();
function cachedTextLines(n){
 const weight=n.highlighted?800:500;
 const old=wrappedTextCache.get(n);
 if(old&&old.text===n.text&&old.width===n.w&&old.size===n.fs&&old.weight===weight)return old.lines;
 const lines=textLines(n.text,n.w-22,n.fs,weight);
 wrappedTextCache.set(n,{text:n.text,width:n.w,size:n.fs,weight,lines});
 return lines;
}
function nodeHeightFit(n,text=n.text){const lines=text===n.text?cachedTextLines(n):textLines(text,n.w-22,n.fs,n.highlighted?800:500);return Math.max(64,lines.length*(n.fs*1.33)+25);}

function findNodeAt(p,excludeId=null){
 // Reverse order matches the visually topmost memo on the canvas.
 for(let i=doc.nodes.length-1;i>=0;i--){const n=doc.nodes[i];if(n.id!==excludeId&&p.x>=n.x&&p.x<=n.x+n.w&&p.y>=n.y&&p.y<=n.y+n.h)return n;}return null;

function endpointTarget(p,edge,handle){
 const direct=findNodeAt(p);
 if(direct)return direct;
 // A handle can sit exactly on (or a little outside) a memo border.
 // Keep its own node as a drop target even if the pointer misses the rectangle.
 const own=doc.nodes.find(n=>n.id===edge[handle]);

function dropTarget(moving,p){

 if(direct)return direct;

 for(const n of doc.nodes){
  if(n.id===moving.id)continue;
  const w=Math.max(0,Math.min(n.x+n.w,moving.x+moving.w)-Math.max(n.x,moving.x));
  const h=Math.max(0,Math.min(n.y+n.h,moving.y+moving.h)-Math.max(n.y,moving.y));
  const share=w*h/Math.min(n.w*n.h,moving.w*moving.h);
  if(share>0.2&&share>best){candidate=n;best=share;}

}

  const now=Date.now();if(lastTap&&lastTap.id===target.dataset.id&&now-lastTap.time<360)openEditor(target.dataset.id);lastTap={id:target.dataset.id,time:now};
 }
}});
svg.addEventListener('pointercancel',e=>stopPointer(e,true));
svg.addEventListener('dblclick',e=>{const target=e.target.closest('[data-kind]');if(target?.dataset.kind==='node')openEditor(target.dataset.id);else if(!target&&mode==='select')newNode(worldAt(e.clientX,e.clientY));});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,camera.z*Math.exp(-e.deltaY*.0012));},{passive:false});
svg.addEventListener('contextmenu',e=>e.preventDefault());

// 메뉴에서 실행한 기능은 그대로 유지하면서 메뉴만 자동 닫습니다.
document.querySelectorAll('.toolbar-menu').forEach(menu=>{
 menu.addEventListener('click',e=>{
  if(e.target.closest('.toolbar-menu-items button'))menu.open=false;
  else if(e.target.closest('summary'))document.querySelectorAll('.toolbar-menu').forEach(other=>{if(other!==menu)other.open=false;});
 });
});
document.addEventListener('pointerdown',e=>{
 if(!e.target.closest('.toolbar-menu'))document.querySelectorAll('.toolbar-menu').forEach(menu=>{menu.open=false;});
});
// V/N/C/H 단축키와 캔버스 직접 조작은 계속 지원합니다.
function toggleSelectedHighlight(color){
 if(!selection.nodes.length)return;
 const selected=new Set(selection.nodes),target=doc.nodes.filter(n=>selected.has(n.id));
 const all=target.every(n=>n.highlighted&&(color==='black'?n.highlightColor==='black':n.highlightColor!=='black'));
 mutate(()=>{for(const n of target){n.highlighted=!all;if(all)delete n.highlightColor;else if(color==='black')n.highlightColor='black';else delete n.highlightColor;}});
}
$('fitBtn').onclick=fit;

$('sidebarToggle').onclick=()=>{$('sidebar').classList.toggle('open');$('sidebarToggle').textContent=$('sidebar').classList.contains('open')?'✕ 닫기':'⚙ 설정';};
$('saveBtn').onclick=()=>{finishEdit(true);download('PBT_curve_map.json',JSON.stringify(doc,null,2),'application/json;charset=utf-8');};
$('openBtn').onclick=()=>{$('fileInput').value='';$('fileInput').click();};
$('fileInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=sanitizeImport(JSON.parse(await f.text()));mutate(()=>{doc=d;clearSel();});fit();}catch(err){alert('파일을 불러올 수 없습니다.\n'+err.message);}});
$('svgBtn').onclick=()=>download('PBT_curve_map.svg',svgExport(),'image/svg+xml;charset=utf-8');
$('pngBtn').onclick=pngExport;
$('newBtn').onclick=()=>{if(!confirm('현재 도식을 비우고 새 문서를 만들까요? 이전 상태는 실행 취소로 복구할 수 있습니다.'))return;mutate(()=>{doc=emptyDoc();clearSel();});fit();};
$('exampleBtn').onclick=()=>{if(doc.nodes.length&&!confirm('기본 예제로 현재 도식을 교체할까요?\n저장하지 않은 작업은 먼저 JSON으로 저장하세요.'))return;mutate(()=>{doc=addSample();clearSel();});fit();};
$('showZones').addEventListener('change',e=>mutate(()=>{doc.showZones=e.target.checked;}));
$('showGrid').addEventListener('change',e=>mutate(()=>{doc.showGrid=e.target.checked;}));
$('zoneNamesBtn').onclick=()=>{$('zoneFields').innerHTML=doc.zones.map((t,i)=>`<label>${i+1}번 영역<input data-zone="${i}" maxlength="60" value="${esc(t)}" /></label>`).join('');$('zoneDialog').style.display='flex';};
$('zoneCancel').onclick=()=>{$('zoneDialog').style.display='none';};
$('zoneDialog').addEventListener('pointerdown',e=>{if(e.target===$('zoneDialog'))$('zoneDialog').style.display='none';});
$('zoneApply').onclick=()=>{const vals=[...$('zoneFields').querySelectorAll('input')].map(i=>i.value);$('zoneDialog').style.display='none';mutate(()=>{doc.zones=vals;});};
$('editText').addEventListener('input',positionEditor);
$('editText').addEventListener('blur',()=>finishEdit(true));
$('editText').addEventListener('keydown',e=>{
 if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();finishEdit(true);}
 if(e.key==='Escape'){e.preventDefault();finishEdit(false);}
});
// 드래그 중에는 SVG만 갱신하여 슬라이더 DOM/포커스가 재생성되지 않습니다.
let sliderBefore=null;
// 키보드로 조절할 때는 스냅으로 인접 값을 선택할 수 없게 되는 문제를 방지합니다.
$('inspector').addEventListener('keydown',event=>{
 if(event.target.matches('input.setting-slider') && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','PageUp','PageDown','Home','End'].includes(event.key))
  event.target.dataset.keyboardAdjusting='true';
});
$('inspector').addEventListener('keyup',event=>{
 if(event.target.matches('input.setting-slider'))delete event.target.dataset.keyboardAdjusting;
});
$('inspector').addEventListener('focusout',event=>{
 if(event.target.matches('input.setting-slider'))delete event.target.dataset.keyboardAdjusting;
});
$('inspector').addEventListener('input',event=>{
 const id=event.target.id;
 if(!['insFontSlider','insBatchFontSlider','insEdgeWidthSlider'].includes(id))return;
 if(sliderBefore===null)sliderBefore=JSON.stringify(doc);
 const rawValue=Number(event.target.value);
 const value=event.target.dataset.keyboardAdjusting==='true'?rawValue:
  id==='insEdgeWidthSlider'
   ? snapSliderValue(rawValue,DEFAULT_EDGE_WIDTH,0.35)
   : snapSliderValue(rawValue,DEFAULT_NODE_FONT,1);
 if(value!==rawValue)event.target.value=String(value);
 if(id==='insFontSlider'){
  const n=doc.nodes.find(t=>t.id===selection.nodes[0]);if(!n)return;
  n.fs=clamp(Math.round(value),15,40);
  n.h=Math.max(n.h,Math.ceil(nodeHeightFit(n)));
  const number=$('insFont');if(number)number.value=String(n.fs);
  renderNodes();renderLinks();renderOverlay();
 }else if(id==='insBatchFontSlider'){
  const selected=new Set(selection.nodes),size=clamp(Math.round(value),15,40);
  for(const n of doc.nodes){if(selected.has(n.id)){n.fs=size;n.h=Math.max(n.h,Math.ceil(nodeHeightFit(n)));}}
  const number=$('insBatchFont');if(number)number.value=String(size);
  renderNodes();renderLinks();renderOverlay();
 }else{
  const e=doc.edges.find(t=>t.id===selection.edge);if(!e)return;
  e.width=clamp(value,MIN_EDGE_WIDTH,MAX_EDGE_WIDTH);
  const out=$('insEdgeWidthValue');if(out)out.textContent=e.width.toFixed(1);
  renderLinks();renderOverlay();
 }
});
$('inspector').addEventListener('change',e=>{
 if(['insFontSlider','insBatchFontSlider','insEdgeWidthSlider'].includes(e.target.id)){
  if(sliderBefore!==null){history(sliderBefore);sliderBefore=null;}
  render();return;
 }
 const n=selection.nodes.length===1?doc.nodes.find(t=>t.id===selection.nodes[0]):null;
 const ed=selection.edge?doc.edges.find(t=>t.id===selection.edge):null;
 if(n&&['insWidth','insHeight','insFont'].includes(e.target.id))mutate(()=>{
  if(e.target.id==='insWidth')n.w=clamp(Number(e.target.value)||n.w,90,900);
  if(e.target.id==='insHeight')n.h=clamp(Number(e.target.value)||n.h,55,900);
  if(e.target.id==='insFont'){n.fs=clamp(Number(e.target.value)||n.fs,15,40);n.h=Math.max(n.h,Math.ceil(nodeHeightFit(n)));}
 });
 if(selection.nodes.length>1&&['insBatchWidth','insBatchHeight','insBatchFont'].includes(e.target.id)&&e.target.value.trim()!==''){
  const value=Number(e.target.value);if(!Number.isFinite(value))return;
  const key=({insBatchWidth:'w',insBatchHeight:'h',insBatchFont:'fs'})[e.target.id];
  const min=key==='w'?90:key==='h'?55:15,max=key==='fs'?40:900;
  mutate(()=>{for(const node of doc.nodes){if(selection.nodes.includes(node.id))node[key]=Math.round(clamp(value,min,max));}});
 }
 if(ed&&['insDir','insDash'].includes(e.target.id))mutate(()=>{
  if(e.target.id==='insDir')ed.direction=e.target.value;
  if(e.target.id==='insDash')ed.dash=e.target.checked;
 });
});
$('inspector').addEventListener('click',e=>{const btn=e.target.closest('[data-ins-action]');if(!btn)return;const action=btn.dataset.insAction;
 if(action==='highlight-black'||action==='highlight-red'){toggleSelectedHighlight(action==='highlight-black'?'black':'red');return;}
 if(action==='delete'){deleteSelection();return;}
 if(action==='duplicate'){duplicateSelected();return;}
 if(action==='edit'){if(selection.nodes[0])openEditor(selection.nodes[0]);return;}
 const ed=doc.edges.find(t=>t.id===selection.edge);if(!ed)return;
 if(action==='straight')mutate(()=>straight(ed));
 if(action==='curve')mutate(()=>autoCurve(ed,55));
 if(action==='reverse')mutate(()=>{const before=geom(ed),oldFrom=ed.from,oldFromAnchor=ed.fromAnchor,oldToAnchor=ed.toAnchor;
  ed.from=ed.to;ed.to=oldFrom;
  if(oldToAnchor)ed.fromAnchor=oldToAnchor;else delete ed.fromAnchor;
  if(oldFromAnchor)ed.toAnchor=oldFromAnchor;else delete ed.toAnchor;
  const after=geom(ed);if(before&&after){ed.o1={x:before.c2.x-after.p0.x,y:before.c2.y-after.p0.y};ed.o2={x:before.c1.x-after.p3.x,y:before.c1.y-after.p3.y};}
 });
});
window.addEventListener('keydown',e=>{
 const inp=e.target.closest('input,textarea,select,[contenteditable]');if(inp)return;
 const key=e.key.toLowerCase(),meta=e.ctrlKey||e.metaKey;
 if(meta&&key==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
 if(meta&&key==='y'){e.preventDefault();redo();return;}
 if(meta&&key==='s'){e.preventDefault();$('saveBtn').click();return;}
 if(meta&&key==='d'){e.preventDefault();duplicateSelected();return;}
 if(meta&&key==='a'){e.preventDefault();selection={nodes:doc.nodes.map(n=>n.id),edge:null};renderOverlay();renderInspector();hint();return;}
 if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSelection();return;}
 if(e.key==='Escape'){connectFrom=null;clearSel();setMode('select');render();return;}
 if(e.code==='Space'&&!e.repeat){e.preventDefault();spaceHeld=true;return;}
 if(meta||e.altKey)return;
 if(key==='0'){e.preventDefault();fit();return;}
 if(key==='v')setMode('select');if(key==='n')setMode('note');if(key==='c')setMode('connect');if(key==='h')setMode('pan');
});
window.addEventListener('keyup',e=>{if(e.code==='Space')spaceHeld=false;});
window.addEventListener('blur',()=>{spaceHeld=false;});
window.addEventListener('resize',updateView);
try{
 const saved=localStorage.getItem('pbt-curve-map-v1');
 doc=saved?sanitizeImport(JSON.parse(saved)):addSample();
 // 기존에 수정 없이 저장했던 구버전 영어 예제만 교체합니다.
 // 사용자가 직접 수정한 문서는 자동으로 덮어쓰지 않습니다.
 if(saved&&(isUntouchedLegacySample(doc)||isUnedited17PtExample(doc)||isUneditedPreviousBuiltin(doc)||isUneditedPreviousV20Builtin(doc))){doc=addSample();persist();}
}catch(err){doc=addSample();}
render();requestAnimationFrame(fit);
})();
</script>
</body>
</html>
